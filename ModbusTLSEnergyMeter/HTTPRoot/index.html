<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SunSpec Modbus/TLS Energy Meter</title>
<style>
/*
   The same frame a charging station wears: a menu on the left, a page on the
   right, and a log that has to stay readable when a thousand lines an hour go
   through it. The design tokens are that project's, so that somebody looking
   after both does not have to learn two interfaces.
*/
:root {
  --bg:            #f6f7f9;
  --surface:       #ffffff;
  --text:          #1f2933;
  --muted:         #616e7c;
  --accent:        #1b7f4d;
  --accent-dark:   #14633c;
  --ok:            #1e7f4f;
  --warn:          #c98a1b;
  --error:         #b42318;
  --error-bg:      #fde8e6;
  --warn-bg:       #fff7e6;
  --border:        #d9dee5;
  --sidebar:       #16202b;
  --sidebar-text:  #c9d4df;
  --sidebar-hi:    #ffffff;
  --radius:        8px;
  --sidebar-width: 15rem;
  --mono:          ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  line-height: 1.45;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2 { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
code { font-family: var(--mono); font-size: .9em; }

/* ---- buttons and fields ---- */

.btn {
  display: inline-flex; align-items: center; gap: .4rem;
  font: inherit; padding: .45rem .9rem;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .6; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
.btn.primary:disabled { background: var(--border); border-color: var(--border); color: var(--muted); }
.btn.small { padding: .3rem .6rem; font-size: .85rem; }

input, select {
  font: inherit; padding: .45rem .6rem;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); width: 100%;
}

label.field { display: block; margin-bottom: .9rem; }
label.field > span { display: block; color: var(--muted); font-size: .85rem; margin-bottom: .25rem; }

.chip {
  display: inline-block; padding: .05rem .5rem; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--muted); font-size: .78rem;
}
.chip.on    { color: var(--ok);    border-color: var(--ok);    background: #eaf6ef; }
.chip.off   { color: var(--muted); }
.chip.alert { color: var(--error); border-color: var(--error); background: var(--error-bg); }

.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }

/* ---- the shell ---- */

.shell { display: grid; grid-template-columns: var(--sidebar-width) 1fr; height: 100%; overflow: hidden; }

.sidebar { display: flex; flex-direction: column; min-height: 0; background: var(--sidebar); color: var(--sidebar-text); }

.sidebar .brand {
  display: flex; align-items: center; gap: .55rem;
  padding: 1rem 1.1rem; font-weight: 600; color: var(--sidebar-hi);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar .brand svg { color: var(--accent); flex: none; }

.sidebar .menu { list-style: none; margin: .5rem 0 0; padding: 0; flex: 1; overflow-y: auto; }
.sidebar .menu a {
  display: flex; align-items: center; gap: .65rem;
  padding: .6rem 1.1rem; color: var(--sidebar-text);
}
.sidebar .menu a:hover { background: rgba(255,255,255,.06); color: var(--sidebar-hi); text-decoration: none; }
.sidebar .menu a.active { background: rgba(27,127,77,.22); color: var(--sidebar-hi); box-shadow: inset 3px 0 0 var(--accent); }
.sidebar .menu svg { width: 1rem; flex: none; opacity: .9; }

.sidebar .submenu { list-style: none; margin: 0 0 .35rem; padding: 0; }
.sidebar .submenu a { padding-left: 2.6rem; font-size: .88rem; }
.sidebar .submenu svg { width: .85rem; opacity: .75; }

.sidebar-foot {
  padding: .9rem 1.1rem; border-top: 1px solid rgba(255,255,255,.08);
  display: flex; flex-direction: column; gap: .5rem;
}
.sidebar-foot .who {
  display: flex; align-items: center; gap: .5rem; color: var(--sidebar-hi);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sidebar-foot .btn { background: transparent; border-color: rgba(255,255,255,.25); color: var(--sidebar-text); justify-content: center; }
.sidebar-foot .btn:hover { border-color: #fff; color: #fff; }
.sidebar-foot .versions { color: rgba(201,212,223,.65); font-size: .75rem; }
.sidebar-foot .roles { color: rgba(201,212,223,.65); }

.content { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }

.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 1rem; flex-wrap: wrap;
  padding: 1.1rem 1.5rem .9rem; border-bottom: 1px solid var(--border); background: var(--surface);
}
.page-head h1 { margin: 0; font-size: 1.35rem; }
.page-head p  { margin: .15rem 0 0; font-size: .9rem; }
.page-actions { display: flex; align-items: center; gap: .6rem; }

.content-body { flex: 1; min-height: 0; overflow: auto; padding: 1.25rem 1.5rem 2rem; display: flex; flex-direction: column; }

/* ---- cards ---- */

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr)); gap: 1rem; align-items: start; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1rem 1.2rem 1.1rem;
}
.card > h2 { margin: 0 0 .75rem; font-size: 1rem; display: flex; align-items: center; gap: .5rem; }
.card > h2 svg { color: var(--accent); width: 1rem; flex: none; }
.card > h2 .chip { margin-left: auto; }
.card.wide { grid-column: 1 / -1; }

table.kv { width: 100%; border-collapse: collapse; }
table.kv td { padding: .25rem .6rem .25rem 0; vertical-align: top; }
table.kv td:first-child { color: var(--muted); width: 45%; }
table.num td, table.num th { padding: .25rem .6rem .25rem 0; text-align: right; font-variant-numeric: tabular-nums; }
table.num td:first-child, table.num th:first-child { text-align: left; }
table.num th { color: var(--muted); font-weight: 500; font-size: .85rem; }

.reading { font-size: 2rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.reading span { font-size: 1rem; font-weight: 400; color: var(--muted); }

/* ---- forms ---- */

.form-stack { display: grid; gap: .8rem; }
.form-row { display: grid; grid-template-columns: 1fr auto; gap: .6rem; align-items: center; }
.form-row > span { color: var(--muted); font-size: .9rem; }
.form-row input[type=number], .form-row input[type=text] { width: 9rem; }
.form-actions { display: flex; align-items: center; gap: .6rem; margin-top: .4rem; }
.form-note  { color: var(--ok);    font-size: .85rem; }
.form-error { color: var(--error); font-size: .85rem; }
.hint { color: var(--muted); font-size: .8rem; }

.servers { display: grid; gap: .5rem; }
.server { display: grid; grid-template-columns: minmax(12rem, 1fr) 5rem 7rem auto; gap: .4rem; align-items: center; }
.server input, .server select { width: 100%; }
.btn.danger:hover:not(:disabled) { border-color: var(--error); color: var(--error); }
input[type=checkbox] { width: auto; }

/* ---- the log ---- */

.log { flex: 1; min-height: 14rem; overflow-y: auto; font-family: var(--mono); font-size: .8rem;
       border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.log .line { display: flex; gap: .6rem; padding: .18rem .6rem; border-bottom: 1px solid var(--border); }
.log .line:last-child { border-bottom: none; }
.log .ts   { color: var(--muted); flex: none; }
.log .lvl  { flex: none; width: 4.2rem; color: var(--muted); }
.log .msg  { flex: 1; word-break: break-word; }
.log .tags { color: var(--muted); flex: none; }
.log .warning  { background: var(--warn-bg); }
.log .error,
.log .critical { background: var(--error-bg); }
.log .denied   { background: var(--error-bg); }
.log .denied .lvl { color: var(--error); }

/* ---- signing in ---- */

.signin-page { display: grid; place-items: center; height: 100%; background: var(--bg); }
.signin { width: 22rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; }
.signin h1 { margin: 0 0 .25rem; font-size: 1.2rem; display: flex; align-items: center; gap: .5rem; }
.signin h1 svg { color: var(--accent); }
.signin .err { color: var(--error); font-size: .88rem; min-height: 1.2rem; }

.hidden { display: none !important; }

@media (max-width: 720px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { display: none; }
}
</style>
</head>
<body>

<div id="root"></div>

<script>
"use strict";

// ---------------------------------------------------------------- icons ----
// Inline, because a meter in a cellar has no way to fetch an icon font, and a
// page that half-renders without the network is worse than one that never
// asked for it.
const icons = {
  meter:  '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 1.5A6.5 6.5 0 1 1 1.5 8 6.5 6.5 0 0 1 8 1.5zm.75 2.25h-1.5v4.1l2.9 1.74.75-1.25-2.15-1.3z"/></svg>',
  bolt:   '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M9.5 0 3 9h4l-.5 7L13 7H9z"/></svg>',
  sliders:'<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M1 3h8v1.5H1zM12 3h3v1.5h-3zM10 1.5h1.5v4.5H10zM1 7.25h3v1.5H1zM7 7.25h8v1.5H7zM5 5.75h1.5v4.5H5zM1 11.5h8V13H1zM12 11.5h3V13h-3zM10 10h1.5v4.5H10z"/></svg>',
  dns:    '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zM6.2 2a13 13 0 0 0-1 3.25H2.6A6.5 6.5 0 0 1 6.2 2zM8 1.6c.6.75 1.1 2 1.4 3.65h-2.8C6.9 3.6 7.4 2.35 8 1.6zM2.05 6.75h2.99a15.7 15.7 0 0 0 0 2.5H2.05a6.6 6.6 0 0 1 0-2.5zm4.5 0h2.9a14 14 0 0 1 0 2.5h-2.9a14 14 0 0 1 0-2.5zm4.4 0h2.99a6.6 6.6 0 0 1 0 2.5h-2.99a15.7 15.7 0 0 0 0-2.5zm-1.55-1.5a13 13 0 0 0-1-3.25 6.5 6.5 0 0 1 3.6 3.25zM2.6 10.75h2.6a13 13 0 0 0 1 3.25 6.5 6.5 0 0 1-3.6-3.25zm4.0 0h2.8c-.3 1.65-.8 2.9-1.4 3.65-.6-.75-1.1-2-1.4-3.65zm4.2 0h2.6a6.5 6.5 0 0 1-3.6 3.25 13 13 0 0 0 1-3.25z"/></svg>',
  clock:  '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 1.5A6.5 6.5 0 1 1 1.5 8 6.5 6.5 0 0 1 8 1.5zM7.25 3.5v5.1l3.6 2.15.75-1.25-2.85-1.7V3.5z"/></svg>',
  cert:   '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0 1.5 2.5v5c0 3.9 2.8 7.2 6.5 8.5 3.7-1.3 6.5-4.6 6.5-8.5v-5zm0 1.6 5 1.9v4c0 3.1-2.1 5.8-5 7-2.9-1.2-5-3.9-5-7v-4zM7.1 10.6 4.6 8.1l1.05-1.05L7.1 8.5l3.25-3.25L11.4 6.3z"/></svg>',
  logs:   '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M1 2.5h2v2H1zM4.5 2.5H15v2H4.5zM1 7h2v2H1zM4.5 7H15v2H4.5zM1 11.5h2v2H1zM4.5 11.5H15v2H4.5z"/></svg>',
  user:   '<svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 8a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm0 1.5c-3 0-6 1.5-6 3.5V15h12v-2c0-2-3-3.5-6-3.5z"/></svg>'
};

// ----------------------------------------------------------------- state ----

const state = {
  user:         null,
  permissions:  [],
  stream:       null,
  poller:       null,
  lastLogId:    0,
  entries:      [],     // newest first
  logTag:       "",
  version:      "-"
};

const may   = (p) => state.permissions.includes(p);
const $     = (sel, root) => (root || document).querySelector(sel);
const esc   = (t) => { const d = document.createElement("div"); d.textContent = t === null || t === undefined ? "" : String(t); return d.innerHTML; };
const fmt   = (v, digits) => (v === null || v === undefined) ? "-" : Number(v).toFixed(digits === undefined ? 2 : digits);

async function call(method, path, body) {
  const options = { method, headers: {}, credentials: "same-origin" };
  if (body !== undefined) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  let response;
  try { response = await fetch(path, options); }
  catch { return { status: 0, json: null }; }
  let json = null;
  try { json = await response.json(); } catch { /* not every answer is JSON */ }
  return { status: response.status, json };
}

// ------------------------------------------------------------------ menu ----

const menu = [
  { path: "#/meter", label: "Meter", icon: "bolt" },
  {
    path: "#/configuration", label: "Configuration", icon: "sliders",
    needs: "ReadConfiguration",
    children: [
      { path: "#/configuration/dns",          label: "DNS client",   icon: "dns"   },
      { path: "#/configuration/nts",          label: "NTS client",   icon: "clock" },
      { path: "#/configuration/certificates", label: "Certificates", icon: "cert"  }
    ]
  },
  { path: "#/logs", label: "Logs", icon: "logs", needs: "ReadConfiguration" }
];

function visibleMenu() {
  return menu.filter(e => !e.needs || may(e.needs));
}

// ----------------------------------------------------------------- shell ----

function shell(active, title, subtitle, actions) {

  const link = (entry) =>
    `<a href="${entry.path}" class="${active === entry.path || (entry.children && active.startsWith(entry.path)) ? "active" : ""}">
       ${icons[entry.icon] || ""}<span>${esc(entry.label)}</span>
     </a>`;

  $("#root").innerHTML = `
    <div class="shell">

      <nav class="sidebar" aria-label="Sections">

        <div class="brand">${icons.meter}<span>Energy Meter</span></div>

        <ul class="menu">
          ${visibleMenu().map(entry => `
            <li>
              ${link(entry)}
              ${entry.children && active.startsWith(entry.path)
                  ? `<ul class="submenu">${entry.children.map(c => `<li>${link(c)}</li>`).join("")}</ul>`
                  : ""}
            </li>`).join("")}
        </ul>

        <div class="sidebar-foot">
          <div class="who">${icons.user}<span>${esc(state.user ? state.user.userId : "-")}</span></div>
          <div class="roles small">${esc(state.user && state.user.role ? state.user.role : "no role here")}</div>
          <button type="button" id="sign-out" class="btn small">Sign out</button>
          <div class="versions small">meter ${esc(state.version)}</div>
        </div>

      </nav>

      <main class="content">
        <header class="page-head">
          <div>
            <h1>${esc(title)}</h1>
            ${subtitle ? `<p class="muted">${esc(subtitle)}</p>` : ""}
          </div>
          <div class="page-actions">${actions || ""}</div>
        </header>
        <div id="body" class="content-body"></div>
      </main>

    </div>`;

  $("#sign-out").onclick = signOut;

  return $("#body");

}

// ------------------------------------------------------------------ pages ---

async function pageMeter(body) {

  body.innerHTML = `<div class="cards">
    <div class="card">
      <h2>${icons.bolt}Measuring<span class="chip" id="modeChip">-</span></h2>
      <div class="reading"><span id="totalW">-</span> <span>W</span></div>
      <table class="num" id="phases"></table>
    </div>
    <div class="card">
      <h2>${icons.meter}Totals</h2>
      <table class="kv" id="totals"></table>
    </div>
    <div class="card">
      <h2>${icons.sliders}This meter</h2>
      <table class="kv" id="status"></table>
    </div>
    ${may("WriteRegisters") ? `
    <div class="card">
      <h2>${icons.sliders}Commanded registers</h2>
      <label class="field"><span>Meter mode (register 40094)</span>
        <select id="modeSelect">
          <option value="0">0 - net</option>
          <option value="1">1 - import only</option>
          <option value="2">2 - export only</option>
        </select>
      </label>
      <div class="row">
        <button class="btn primary" id="setMode">Set mode</button>
        <button class="btn" id="resetEnergy">Clear energy counters</button>
      </div>
      <p class="small muted" style="margin:.7rem 0 0">Writing here is the same register a
         Modbus client writes, and is written down in the log the same way.</p>
    </div>` : ""}
  </div>`;

  if (may("WriteRegisters")) {
    $("#setMode").onclick = async () => {
      await call("PUT", "api/v1/meter/mode", { mode: Number($("#modeSelect").value) });
      await refreshMeter();
    };
    $("#resetEnergy").onclick = async () => {
      if (!confirm("Clear the energy counters of this meter?")) return;
      await call("POST", "api/v1/meter/energy/reset");
      await refreshMeter();
    };
  }

  await refreshStatus();
  await refreshMeter();

}

async function refreshMeter() {

  const { status, json } = await call("GET", "api/v1/meter");
  if (status !== 200 || !json || !$("#totalW")) return;

  $("#totalW").textContent   = fmt(json.total.power_W, 0);
  $("#modeChip").textContent = `mode ${json.meterMode}`;

  const rows = [`<tr><th></th><th>V</th><th>A</th><th>W</th></tr>`];
  for (const p of json.phases.concat([json.total]))
    rows.push(`<tr><td>${esc(p.name)}</td><td>${fmt(p.voltage_V, 1)}</td><td>${fmt(p.current_A)}</td><td>${fmt(p.power_W, 0)}</td></tr>`);
  $("#phases").innerHTML = rows.join("");

  if ($("#totals")) $("#totals").innerHTML = kv([
    ["Frequency",    `${fmt(json.frequency_Hz)} Hz`],
    ["Exported",     `${fmt(json.energy.exported_Wh, 0)} Wh`],
    ["Imported",     `${fmt(json.energy.imported_Wh, 0)} Wh`],
    ["Manufacturer", json.manufacturer],
    ["Model",        `${json.model} (SunSpec ${json.sunSpecModel})`],
    ["Serial",       json.serialNumber],
    ["Unit address", json.unitAddress]
  ]);

}

async function refreshStatus() {

  const { status, json } = await call("GET", "api/v1/status");
  if (status !== 200 || !json || !$("#status")) return;

  state.version = json.version;

  $("#status").innerHTML = kv([
    ["Device",        json.device],
    ["Modbus/TLS",    `${json.modbus.address}:${json.modbus.port}`],
    ["Registers",     `${json.modbus.baseAddress} - ${json.modbus.baseAddress + json.modbus.registerCount - 1}`],
    ["Running since", new Date(json.startedAt).toLocaleString()],
    ["Uptime",        `${Math.floor(json.uptime_s / 60)} min`]
  ]);

}

async function pageDNS(body) {

  const { status, json } = await call("GET", "api/v1/configuration/dns");
  if (status !== 200) return refused(body, status);

  const mayChange = may("ChangeNetworkSettings");
  const servers   = (json.servers || []).map(s => ({ ...s }));

  const flag = (name, label, value) => `
    <div class="form-row">
      <span>${esc(label)}</span>
      <input type="checkbox" name="${name}" ${value ? "checked" : ""} ${mayChange ? "" : "disabled"}>
    </div>`;

  const number = (name, label, value, min, max, step) => `
    <div class="form-row">
      <span>${esc(label)}</span>
      <input type="number" name="${name}" value="${value === null || value === undefined ? "" : esc(value)}"
             min="${min}" max="${max}" ${step ? `step="${step}"` : ""} ${mayChange ? "" : "disabled"}>
    </div>`;

  body.innerHTML = `<div class="cards">

    <div class="card wide">
      <h2>${icons.dns}Name servers<span class="chip ${json.enabled ? "on" : "off"}">${json.enabled ? "on" : "off"}</span></h2>
      <div class="servers" id="servers"></div>
      <div class="form-actions">
        <button class="btn" id="addServer" ${mayChange ? "" : "disabled"}>Add a name server</button>
      </div>
      <p class="hint">Switching name resolution off takes the servers away from the client,
         which is what being switched off means for everything holding it.</p>
    </div>

    <div class="card">
      <h2>${icons.sliders}How it asks</h2>
      <form class="form-stack" id="dnsForm">
        ${flag("enabled",          "Name resolution on",  json.enabled)}
        ${flag("recursionDesired", "Recursion desired",   json.recursionDesired)}
        ${flag("useCache",         "Use the cache",       json.useCache)}
        ${flag("dnssecOK",         "DNSSEC OK",           json.dnssecOK)}
        ${flag("followCNAMEs",     "Follow CNAMEs",       json.followCNAMEs)}
        ${number("queryTimeoutSeconds", "Query timeout (s)", json.queryTimeoutSeconds, 0.1, 60, "0.1")}
        ${number("maxCNAMEFollows",     "Max CNAME follows", json.maxCNAMEFollows,     0,   255)}
        ${number("maxRetries",          "Max retries",       json.maxRetries,          0,   255)}
        <div class="form-actions">
          <button type="submit" class="btn primary" ${mayChange ? "" : "disabled"}>Save</button>
          <span class="form-note"  id="dnsNote"></span>
          <span class="form-error" id="dnsError"></span>
        </div>
        <span class="hint">Saved to the configuration file, and in effect at once.</span>
      </form>
    </div>

  </div>`;

  function drawServers() {
    $("#servers").innerHTML = servers.length === 0
      ? `<p class="muted small" style="margin:0">No name server; this meter resolves nothing.</p>`
      : servers.map((server, index) => `
          <div class="server">
            <input type="text"   data-field="address"   data-index="${index}" value="${esc(server.address || "")}" placeholder="192.168.1.1" ${mayChange ? "" : "disabled"}>
            <input type="number" data-field="port"      data-index="${index}" value="${esc(server.port || 53)}" min="1" max="65535" ${mayChange ? "" : "disabled"}>
            <select data-field="transport" data-index="${index}" ${mayChange ? "" : "disabled"}>
              ${["UDP", "TCP", "TLS", "HTTPS"].map(t => `<option ${server.transport === t ? "selected" : ""}>${t}</option>`).join("")}
            </select>
            <button class="btn small danger" data-remove="${index}" ${mayChange ? "" : "disabled"}>Remove</button>
          </div>`).join("");
  }

  drawServers();

  $("#servers").addEventListener("input", (event) => {
    const el = event.target;
    if (!el.dataset.field) return;
    const server = servers[Number(el.dataset.index)];
    server[el.dataset.field] = el.dataset.field === "port" ? Number(el.value) : el.value;
  });

  $("#servers").addEventListener("change", (event) => {
    const el = event.target;
    if (el.dataset.field === "transport") servers[Number(el.dataset.index)].transport = el.value;
  });

  $("#servers").addEventListener("click", (event) => {
    const el = event.target.closest("[data-remove]");
    if (!el) return;
    servers.splice(Number(el.dataset.remove), 1);
    drawServers();
  });

  if (mayChange) {
    $("#addServer").onclick = () => { servers.push({ address: "", port: 53, transport: "UDP" }); drawServers(); };

    $("#dnsForm").onsubmit = async (event) => {

      event.preventDefault();
      $("#dnsNote").textContent = ""; $("#dnsError").textContent = "";

      const form = new FormData(event.target);
      const body = {
        enabled:              form.get("enabled")          !== null,
        recursionDesired:     form.get("recursionDesired") !== null,
        useCache:             form.get("useCache")         !== null,
        dnssecOK:             form.get("dnssecOK")         !== null,
        followCNAMEs:         form.get("followCNAMEs")     !== null,
        queryTimeoutSeconds:  Number(form.get("queryTimeoutSeconds")),
        maxCNAMEFollows:      Number(form.get("maxCNAMEFollows")),
        maxRetries:           Number(form.get("maxRetries")),
        // The whole list every time: a name server is one value, and merging
        // an old list into a new one by position is how a removed server
        // comes back.
        servers:              servers.filter(s => (s.address || "").trim().length > 0)
      };

      const { status, json } = await call("PUT", "api/v1/configuration/dns", body);

      if (status === 200) { $("#dnsNote").textContent = "Saved."; setTimeout(route, 600); }
      else $("#dnsError").textContent = (json && json.error) || `The meter answered ${status}.`;

    };
  }

}

async function pageNTS(body) {

  const nts   = await call("GET", "api/v1/configuration/nts");
  const clock = await call("GET", "api/v1/configuration/time");
  if (nts.status !== 200) return refused(body, nts.status);

  const n = nts.json, c = clock.json || {};
  const mayChange = may("ChangeNetworkSettings");

  const field = (name, label, value, type, min, max, step) => `
    <div class="form-row">
      <span>${esc(label)}</span>
      <input type="${type || "text"}" name="${name}" value="${value === null || value === undefined ? "" : esc(value)}"
             ${min !== undefined ? `min="${min}"` : ""} ${max !== undefined ? `max="${max}"` : ""}
             ${step ? `step="${step}"` : ""} ${mayChange ? "" : "disabled"}>
    </div>`;

  body.innerHTML = `<div class="cards">

    <div class="card">
      <h2>${icons.clock}Time server<span class="chip ${n.enabled ? "on" : "off"}">${n.enabled ? "on" : "off"}</span></h2>
      <form class="form-stack" id="ntsForm">
        <div class="form-row"><span>Ask the time server</span>
          <input type="checkbox" name="enabled" ${n.enabled ? "checked" : ""} ${mayChange ? "" : "disabled"}></div>
        ${field("hostname",                  "Hostname",             n.hostname)}
        ${field("ntsKEPort",                 "NTS-KE port",          n.ntsKEPort,      "number", 1, 65535)}
        ${field("ntpPort",                   "NTP port",             n.ntpPort,        "number", 1, 65535)}
        ${field("timeoutSeconds",            "Timeout (s)",          n.timeoutSeconds, "number", 0.1, 120, "0.1")}
        ${field("checkEverySeconds",         "Check every (s)",      c.checkEvery_s,   "number", 10, 86400)}
        <div class="form-actions">
          <button type="submit" class="btn primary" ${mayChange ? "" : "disabled"}>Save</button>
          ${may("RunDiagnostics") ? `<button type="button" class="btn" id="syncNow">Check the clock now</button>` : ""}
          <span class="form-note"  id="ntsNote"></span>
          <span class="form-error" id="ntsError"></span>
        </div>
        <span class="hint">Changing the server builds a new client: the cookies of the old one
              belonged to that host and to no other.</span>
      </form>
    </div>

    <div class="card">
      <h2>${icons.clock}This meter's clock<span class="chip ${c.isLegalTime ? "on" : "alert"}">${c.isLegalTime ? "legal time" : "unverified"}</span></h2>
      <table class="kv" id="clock"></table>
      <p class="small muted" style="margin:.7rem 0 0">${esc(c.why || "")}</p>
    </div>

    <div class="card">
      <h2>${icons.cert}What counts as legal time</h2>
      <form class="form-stack" id="legalForm">
        ${field("legalTimeAuthority",        "Authority",            c.legalAuthority,                                        "text")}
        ${field("legalTimeToleranceSeconds", "Tolerance (s)",        c.legalTolerance_ms === undefined ? "" : c.legalTolerance_ms / 1000, "number", 0.001, 60, "0.001")}
        ${field("legalTimeMaxAgeSeconds",    "Max age of a check (s)", c.legalMaxAge_s,                                       "number", 10, 86400)}
        <div class="form-actions">
          <button type="submit" class="btn primary" ${mayChange ? "" : "disabled"}>Save</button>
          <span class="form-note"  id="legalNote"></span>
          <span class="form-error" id="legalError"></span>
        </div>
        <span class="hint">This meter cannot find out by itself who stands behind a time server.
              Naming one is the operator saying so, and it is what makes the question
              "is this legal time" mean anything at all.</span>
      </form>
    </div>

  </div>`;

  renderClock(c);

  async function save(form, note, error, body) {
    $(note).textContent = ""; $(error).textContent = "";
    const { status, json } = await call("PUT", "api/v1/configuration/nts", body);
    if (status === 200) { $(note).textContent = "Saved."; setTimeout(route, 600); }
    else $(error).textContent = (json && json.error) || `The meter answered ${status}.`;
  }

  if (mayChange) {

    $("#ntsForm").onsubmit = async (event) => {
      event.preventDefault();
      const form = new FormData(event.target);
      await save("#ntsForm", "#ntsNote", "#ntsError", {
        enabled:             form.get("enabled") !== null,
        hostname:            String(form.get("hostname") || "").trim(),
        ntsKEPort:           Number(form.get("ntsKEPort")),
        ntpPort:             Number(form.get("ntpPort")),
        timeoutSeconds:      Number(form.get("timeoutSeconds")),
        checkEverySeconds:   Number(form.get("checkEverySeconds"))
      });
    };

    $("#legalForm").onsubmit = async (event) => {
      event.preventDefault();
      const form      = new FormData(event.target);
      const authority = String(form.get("legalTimeAuthority") || "").trim();
      await save("#legalForm", "#legalNote", "#legalError", {
        legalTimeAuthority:         authority.length > 0 ? authority : null,
        legalTimeToleranceSeconds:  Number(form.get("legalTimeToleranceSeconds")),
        legalTimeMaxAgeSeconds:     Number(form.get("legalTimeMaxAgeSeconds"))
      });
    };

  }

  if (may("RunDiagnostics"))
    $("#syncNow").onclick = async () => {
      const b = $("#syncNow");
      b.disabled = true; b.textContent = "Asking ...";
      await call("POST", "api/v1/configuration/nts/sync");
      route();
    };

}

function renderClock(c) {
  if (!$("#clock")) return;
  $("#clock").innerHTML = kv([
    ["Now",         c.now ? new Date(c.now).toLocaleString() : "-"],
    ["Last check",  c.lastCheck ? new Date(c.lastCheck).toLocaleString() : "never"],
    ["Offset",      c.lastCheckOffset_ms === null || c.lastCheckOffset_ms === undefined ? "-" : `${fmt(c.lastCheckOffset_ms, 1)} ms`],
    ["Authority",   c.legalAuthority || "none configured"],
    ["Tolerance",   c.legalTolerance_ms === undefined ? "-" : `${fmt(c.legalTolerance_ms, 0)} ms`],
    ["Max age",     c.legalMaxAge_s === undefined ? "-" : `${Math.round(c.legalMaxAge_s / 60)} min`]
  ]);
}

async function pageCertificates(body) {

  const { status, json } = await call("GET", "api/v1/configuration/certificates");
  if (status !== 200) return refused(body, status);

  const card = (title, c) => `
    <div class="card">
      <h2>${icons.cert}${esc(title)}</h2>
      <table class="kv">
        <tr><td>Subject</td><td>${esc(c.subject)}</td></tr>
        <tr><td>Issuer</td><td>${esc(c.issuer)}</td></tr>
        <tr><td>Valid from</td><td>${new Date(c.notBefore).toLocaleDateString()}</td></tr>
        <tr><td>Valid until</td><td>${new Date(c.notAfter).toLocaleDateString()}</td></tr>
        <tr><td>Thumbprint</td><td><code>${esc(c.thumbprint)}</code></td></tr>
      </table>
    </div>`;

  body.innerHTML = `<div class="cards">
    ${card("Meter certificate", json.meter)}
    ${card("Client CA", json.clientCA)}
    <div class="card">
      <h2>${icons.cert}SunSpec roles</h2>
      <p class="small muted" style="margin:0 0 .6rem">What a Modbus/TLS client may do is decided by
         the role in its certificate, not by an account here.</p>
      <table class="kv">
        ${(json.sunSpecRoles || []).map(r => `<tr><td colspan="2"><code>${esc(r)}</code></td></tr>`).join("")}
      </table>
    </div>
  </div>`;

}

async function pageLogs(body) {

  body.innerHTML = `
    <div class="row" style="margin-bottom:.8rem">
      <select id="tagFilter" style="width:auto"><option value="">everything</option></select>
      <span class="chip" id="logCount"></span>
      <span class="chip" id="streamState">${state.stream ? (state.stream.readyState === 1 ? "live" : "connecting") : "off"}</span>
      <button class="btn small" id="verify">Check the log</button>
      <span class="small muted">Every Modbus request is in here, allowed or refused.</span>
    </div>
    <div id="verdict"></div>
    <div class="log" id="log"></div>`;

  $("#verify").onclick = async () => {

    const b = $("#verify");
    b.disabled = true; b.textContent = "Checking ...";

    const { status, json } = await call("GET", "api/v1/logs/verify");

    b.disabled = false; b.textContent = "Check the log";

    if (status !== 200 || !json) {
      $("#verdict").innerHTML = `<div class="card" style="margin-bottom:.8rem"><p class="form-error" style="margin:0">The meter answered ${status}.</p></div>`;
      return;
    }

    if (!json.persisted) {
      $("#verdict").innerHTML = `<div class="card" style="margin-bottom:.8rem"><p class="muted" style="margin:0">${esc(json.why)}</p></div>`;
      return;
    }

    $("#verdict").innerHTML = `
      <div class="card" style="margin-bottom:.8rem">
        <h2>${icons.cert}The log on disk<span class="chip ${json.intact ? "on" : "alert"}">${json.intact ? "intact" : "broken"}</span></h2>
        ${json.intact
            ? `<p class="small" style="margin:0 0 .6rem">Every one of the ${json.entries} lines matches its own hash,
                 follows the line before it, and is signed by key <code>${esc(json.keyId)}</code>.</p>`
            : `<p class="form-error" style="margin:0 0 .6rem">${esc(json.firstProblem)}</p>`}
        <table class="kv">
          <tr><td>Head</td><td><code>${esc(json.head)}</code></td></tr>
          <tr><td>Where</td><td>${esc(json.path)}</td></tr>
          <tr><td>Kept</td><td>${esc(json.keepDays)} days</td></tr>
          ${(json.files || []).map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.entries)} lines - ${f.intact ? "intact" : esc(f.problem)}</td></tr>`).join("")}
        </table>
        <p class="hint" style="margin:.7rem 0 0">The signing key sits beside the log, so this says the files
           were not edited by anybody who lacked it - not that nobody with it rewrote them. Compare the head
           against a copy kept elsewhere to find out whether the log was replaced or cut short.</p>
      </div>`;

  };

  $("#tagFilter").onchange = async () => { state.logTag = $("#tagFilter").value; await loadLog(); };

  await loadLog();

}

function refused(body, status) {
  body.innerHTML = `<div class="card"><h2>Not for you</h2>
    <p class="muted">This meter answered ${status === 403 ? "403: your role does not carry the permission this page needs." : status}.</p></div>`;
}

function kv(rows) {
  return rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v === null || v === undefined ? "-" : esc(v)}</td></tr>`).join("");
}

// ------------------------------------------------------------------- log ----

function lineHTML(entry) {
  const denied = (entry.tags || []).includes("denied");
  return `<div class="line ${entry.level} ${denied ? "denied" : ""}">
            <span class="ts">${new Date(entry.timestamp).toLocaleTimeString()}</span>
            <span class="lvl">${esc(entry.level)}</span>
            <span class="msg">${esc(entry.message)}</span>
            <span class="tags">${esc((entry.tags || []).join(" "))}</span>
          </div>`;
}

function renderLog() {
  const log = $("#log");
  if (!log) return;
  log.innerHTML = state.entries.map(lineHTML).join("");
  if ($("#logCount")) $("#logCount").textContent = `${state.entries.length} entries`;
}

async function loadLog() {

  const tag = state.logTag;
  const { status, json } = await call("GET", "api/v1/logs?limit=400" + (tag ? `&tag=${encodeURIComponent(tag)}` : ""));
  if (status !== 200 || !json) return;

  state.lastLogId = json.lastId;
  state.entries   = json.entries.slice().reverse();   // newest first
  renderLog();

  const select = $("#tagFilter");
  if (select) {
    const known = new Set(Array.from(select.options).map(o => o.value));
    for (const t of json.tags) if (!known.has(t)) select.add(new Option(t, t));
    select.value = tag;
  }

}

function matchesFilter(entry) {
  const tag = state.logTag;
  return !tag || entry.level === tag || (entry.tags || []).includes(tag);
}

function openStream() {

  if (state.stream) return;

  state.stream = new EventSource("api/v1/events");

  state.stream.onopen  = () => { if ($("#streamState")) $("#streamState").textContent = "live"; };
  state.stream.onerror = () => { if ($("#streamState")) $("#streamState").textContent = "reconnecting"; };

  state.stream.addEventListener("log", (event) => {

    const entry = JSON.parse(event.data);
    if (entry.id <= state.lastLogId) return;   // already in the snapshot
    state.lastLogId = entry.id;

    if (!matchesFilter(entry)) return;

    state.entries.unshift(entry);
    while (state.entries.length > 800) state.entries.pop();

    const log = $("#log");
    if (log) {
      log.insertAdjacentHTML("afterbegin", lineHTML(entry));
      while (log.childNodes.length > 800) log.removeChild(log.lastChild);
      if ($("#logCount")) $("#logCount").textContent = `${state.entries.length} entries`;
    }

  });

}

// ---------------------------------------------------------------- router ----

const routes = [
  { path: "#/meter",                      title: "Meter",        subtitle: "What this meter is measuring right now",       page: pageMeter         },
  { path: "#/configuration/dns",          title: "DNS client",   subtitle: "How this meter resolves names",                page: pageDNS           },
  { path: "#/configuration/nts",          title: "NTS client",   subtitle: "Where this meter reads the time",              page: pageNTS           },
  { path: "#/configuration/certificates", title: "Certificates", subtitle: "What it shows, and who it lets in",            page: pageCertificates  },
  { path: "#/logs",                       title: "Logs",         subtitle: "Everything that happened inside this meter",   page: pageLogs          }
];

async function route() {

  if (!state.user) return;

  let hash = location.hash || "#/meter";
  if (hash === "#/configuration") hash = "#/configuration/dns";

  const match = routes.find(r => r.path === hash) || routes[0];
  const body  = shell(match.path, match.title, match.subtitle);

  await match.page(body);

  // Only the meter page is worth polling; everything else changes when
  // somebody changes it, and the log has a stream of its own.
  if (state.poller) { clearInterval(state.poller); state.poller = null; }
  if (match.path === "#/meter") state.poller = setInterval(refreshMeter, 2000);

}

window.addEventListener("hashchange", route);

// -------------------------------------------------------------- sign in ----

function signInPage(message) {

  $("#root").innerHTML = `
    <div class="signin-page">
      <form class="signin" id="signinForm">
        <h1>${icons.meter}Energy meter</h1>
        <p class="muted small" style="margin:0 0 1.2rem">Sign in to look after this meter.</p>
        <label class="field"><span>User</span><input id="user" autocomplete="username" autofocus></label>
        <label class="field"><span>Password</span><input id="pass" type="password" autocomplete="current-password"></label>
        <button class="btn primary" style="width:100%" type="submit">Sign in</button>
        <p class="err">${esc(message || "")}</p>
        <p class="small muted" style="margin:0">The first administrator and its password are
           printed on the console the first time this meter starts.</p>
      </form>
    </div>`;

  $("#signinForm").onsubmit = async (e) => {
    e.preventDefault();
    const { status, json } = await call("POST", "accounts/auth/login",
                                        { login: $("#user").value, password: $("#pass").value });
    if (status === 200) await start();
    else signInPage((json && (json.error || json.description)) || "Wrong user or password.");
  };

}

async function signOut() {
  await call("POST", "accounts/auth/logout");
  if (state.stream) { state.stream.close(); state.stream = null; }
  if (state.poller) { clearInterval(state.poller); state.poller = null; }
  state.user = null; state.permissions = []; state.entries = []; state.lastLogId = 0;
  signInPage();
}

async function start() {

  const me = await call("GET", "api/v1/me");

  if (me.status !== 200) { signInPage(); return; }

  state.user        = me.json;
  state.permissions = me.json.permissions || [];

  const status = await call("GET", "api/v1/status");
  if (status.status === 200 && status.json) state.version = status.json.version;

  await route();

  if (may("ReadConfiguration")) openStream();

}

start();
</script>
