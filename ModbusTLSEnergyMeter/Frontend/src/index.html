<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title><%= htmlWebpackPlugin.options.title %></title>

    <meta name="description"       content="The web interface of an OpenChargingCloud Modbus/TLS energy meter, served by the Hermod HTTP/1.1 server" />
    <meta name="author"            content="Achim Friedland // GraphDefined GmbH" />

    <!-- Runtime configuration for the bundle: read via document.querySelector,
         so that no inline script is needed and the CSP can stay strict. The
         {{...}} placeholders are replaced by the node when it serves this
         stub - where its JSON API and its accounts are, which moves with a
         base path - and html-webpack-plugin leaves them untouched. -->
    <meta name="api-base"          content="{{APIBase}}" />
    <meta name="ext-base"          content="{{ExtBase}}" />
    <meta name="frontend-version"  content="<%= htmlWebpackPlugin.options.version %>" />
    <meta name="server-version"    content="{{ServerVersion}}" />

    <!-- html-webpack-plugin injects the hashed script and stylesheet tags. -->

</head>

<body>

    <div id="app">
        <noscript>This page needs JavaScript.</noscript>
    </div>

</body>

</html>
